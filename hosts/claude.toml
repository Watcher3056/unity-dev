# Host vocabulary used by this skill.
host = '''Claude Code'''
read-cap = '''Claude Code returns only the first part of a file above its read limit'''
role-prefix = '''unity-dev:'''
role-rules = '''system-prompt instructions'''
role-param = '''`subagent_type`'''
fresh = '''a fresh context'''
role-fresh = ''''''
wait-signal = '''Claude Code delivers a background agent's result as a notification that starts the main thread's next turn: ending the turn is that one call, not a stop, and polling or sleeping in between is the slicing this rule forbids'''
free-slots = ''''''
agent-limit = '''In Claude Code the limit is the `CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS` variable (20 when unset) in the `env` of `~/.claude/settings.json`.'''
agent-msgs = '''the briefs and reports otherwise live only inside the session logs'''
bridge-config-change = '''a server entry in the project's local scope of the user's Claude Code config; and one Unity setting of the package switched off, the one that rewrites its own Claude Code entry when the Editor starts'''
mcp-project-config = '''the local scope of the folder Claude Code runs in (`claude mcp add --scope local`, run there: kept in `~/.claude.json` under that path, out of git)'''
mcp-config-file = ''' (nor `UnityMCP`, the package's own).'''
bridge-auto-register = '''When the Editor starts, it rewrites the package's own Claude Code entry (`UnityMCP`) by itself: a second connection next to this one. Switch that off (EditorPrefs `MCPForUnity.AutoRegisterEnabled` = false, through the bridge or the package's window; it holds for this machine, so say so) and, if `claude mcp list` shows `UnityMCP`, with the user's consent and a backup, remove it (`claude mcp get UnityMCP` names its scope; then `claude mcp remove UnityMCP --scope <that scope>`).'''
mcp-check = '''`claude mcp list`, run in the project, lists the server as connected.'''
mcp-approval = '''Tool calls through it ask for approval in Claude Code unless the user's permissions allow them (`mcp__<server>` in `permissions.allow`); that is the user's choice too.'''
spawn-overflow = '''a spawn past the limit is refused, and [AGENT-LIMIT] says what then'''
limit-error = '''Concurrent subagent limit reached'''
rnd-overflow = '''the rest start later'''
ask-tool = '''`AskUserQuestion` in Claude Code'''
visual-interactive = ''' (interactive as a local HTML page when it helps)'''
visual-interactive-tool = '''- Interactive: a self-contained HTML file in the task output folder, opened in the browser (sent with `SendUserFile` where the session has it).'''
visual-image = '''- Image in the answer: `SendUserFile` where the session has it; else Markdown with the image's absolute path, in angle brackets for spaces: `![Before / after](<D:/path with spaces/compare.png>)`; what unfolds in time goes as its recording (`SendUserFile`, or a link to its path or the graph step that plays it), a state as a picture.'''
visual-folder = '''a task output folder'''

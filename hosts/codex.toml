# Host vocabulary used by this skill.
host = '''Codex'''
read-cap = '''Codex cuts a tool output above its token limit out of the middle, silently'''
role-rules = '''developer instructions'''
role-param = '''`agent_type`'''
fresh = '''`fork_turns: "none"`'''
role-fresh = ''' A role (`agent_type`, [BRIEF]) needs `fork_turns: "none"` too: a full-history fork can't take one.'''
wait-signal = '''Codex delivers a finished agent's final answer to the main thread, and `wait_agent` returns at that moment, so use the tool's longest timeout: `timeout_ms` of ten minutes is known to work, and a minute is a slice'''
free-slots = ''' (close finished ones to free their slots)'''
agent-limit = '''In Codex the limit is `agents.max_concurrent_threads_per_session` in `~/.codex/config.toml`.'''
bridge-config-change = '''a server entry in the project's own Codex config, `.codex/config.toml`; and one Unity setting of the package switched off, the one that writes it into the user's global Codex config'''
mcp-project-config = '''the project's `.codex/config.toml`'''
bridge-auto-register = '''When the Editor starts with a window, the package writes `[mcp_servers.unityMCP]` with an HTTP `url` into the global `~/.codex/config.toml` by itself, and every Codex session in every project then tries to connect to it. Switch that off (EditorPrefs `MCPForUnity.AutoRegisterEnabled` = false, through the bridge or the package's window; it holds for this machine, so say so) and, with the user's consent and a backup, remove the entry it already wrote. Two ways to one server under one name, a `url` and a `command`, make Codex fail to load its config, and then no Codex session starts at all.'''
mcp-check = '''`codex mcp list`, run in the project, loads without errors and lists the server. Codex reads a project's `.codex/config.toml` only when it trusts the project: if it doesn't, say so instead of falling back to the global config.'''
mcp-approval = '''Tool calls through it ask for approval in Codex unless its entry has `default_tools_approval_mode = "approve"`; that is the user's choice too.'''
ask-tool = '''`request_user_input` in Codex (its async form doesn't end the turn: a question the work waits on ends the turn after it)'''
visual-interactive = ''' (interactive via `$visualize` when it helps)'''
visual-interactive-tool = '''- Interactive: the `$visualize` skill (inline HTML).'''
role-prefix = ''''''
agent-msgs = '''messages between agents are encrypted in the session logs'''
visual-image = '''- Image in the answer: Markdown with an absolute path, using angle brackets for spaces: `![Before / after](<D:/path with spaces/compare.png>)`; what unfolds in time goes as its recording, linked (its path or the graph step that plays it: the chat doesn't play video), a state as a picture.'''
mcp-config-file = '''; merge it into that file if it exists. Keep the file out of git through `.git/info/exclude`: it holds a path on this machine.'''
spawn-overflow = '''extra spawns queue, which is fine'''
limit-error = '''agent thread limit reached'''
rnd-overflow = '''the rest queue'''
visual-folder = '''the thread visualization folder or a task output folder'''
